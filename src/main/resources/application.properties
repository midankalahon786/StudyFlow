# ===============================
# Basic Application Settings
# ===============================
spring.application.name=studyflow
server.port=8080

# ===============================
# Database Configuration (PostgreSQL)
# ===============================
# [cite: 2026-02-24]
spring.datasource.url=jdbc:postgresql://localhost:5432/studyflow_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate Settings
# ===============================
# [cite: 2026-02-24]
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tells Hibernate to attempt creating the schema if it doesn't exist
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# Security & JWT Configuration
# ===============================
# Access Token: Short-lived (e.g., 15 minutes = 900,000 ms)
# Refresh Token: Long-lived (e.g., 7 days = 604,800,000 ms)
application.security.jwt.secret-key=${JWT_SECRET_KEY:your_very_long_and_very_secure_random_signing_key_here}
application.security.jwt.expiration=900000
application.security.jwt.refresh-token.expiration=604800000

# ===============================
# Logging & Error Handling
# ===============================
# Helpful for debugging during the Modular Monolith transition
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Max file size per request
spring.servlet.multipart.max-file-size=50MB
# Max total request size (files + fields)
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=192.168.42.100
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false